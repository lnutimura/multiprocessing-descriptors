[project]
name = "mpdescriptors"
version = "1.0.0"
description = "Texture retrieval on the Brodatz album with LBP, GLCM and WLD descriptors, extracted in parallel."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Luan Utimura" }]
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=2.0",
    "pillow>=10",
    "scipy>=1.11",
    "tqdm>=4.66",
]

[project.scripts]
mpdescriptors = "mpdescriptors.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "scikit-image>=0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]
